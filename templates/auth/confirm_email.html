{% extends "base.html" %}
{% block title %}Potwierdzenie e-mail{% endblock %}

{% block content %}
  <h2>Potwierdź swój e-mail</h2>
  <p>Sprawdź pocztę — na Twój adres wysłaliśmy kod ważny 15 minut.</p>

  <form method="post">
    {{ form.hidden_tag() }}
    <div class="form-group">
      {{ form.code.label }}<br>
      {{ form.code(class="form-control") }}
    </div>
    <button type="submit" class="btn btn-primary">{{ form.submit.label.text }}</button>
  </form>
{% endblock %}
