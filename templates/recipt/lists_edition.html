<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twoja Lista Zakupów</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            color: #374151;
        }
        .container {
            max-width: 1200px;
        }
        .product-item {
            display: flex;
            align-items: center;
            gap: 0.75rem; /* 12px */
            padding: 0.5rem 0;
            border-bottom: 1px solid #e5e7eb;
        }
        .product-item:last-child {
            border-bottom: none;
        }
        .product-item input[type="text"] { /* Only text input remains for products */
            padding: 0.5rem;
            border-radius: 0.375rem; /* rounded-md */
            border: 1px solid #d1d5db;
            flex-grow: 1;
        }
        .remove-product {
            background-color: #ef4444; /* red-500 */
            color: white;
            padding: 0.5rem 0.75rem;
            border-radius: 0.375rem;
            font-size: 0.875rem; /* text-sm */
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .remove-product:hover {
            background-color: #dc2626; /* red-600 */
        }
        .btn-primary {
            background-color: #2563eb; /* blue-600 */
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem; /* rounded-lg */
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-primary:hover {
            background-color: #1d4ed8; /* blue-700 */
        }
        .checkbox-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.25rem;
            padding: 0.5rem;
            border: 1px solid #e5e7eb;
            border-radius: 0.375rem;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.875rem;
            white-space: nowrap;
        }
        .table-auto {
            width: 100%;
            border-collapse: collapse;
        }
        .table-auto th, .table-auto td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        .table-auto th {
            background-color: #f9fafb;
            font-weight: 600;
        }
    </style>
</head>
<body class="bg-gray-100 p-8">
    <div class="container mx-auto bg-white rounded-lg shadow-xl p-8">
        <!-- Mock Data (Replace with Jinja2 variables in your Flask app) -->
        <script>
            // This is mock data for demonstration. In a real Flask app,
            // these would be passed from your backend context, e.g., using shopping_list_items | tojson.
            const mockShoppingListItems = [
                { name: 'Chleb (pełnoziarnisty)', assigned_friends: ['friend1'] },
                { name: 'Mleko (2%)', assigned_friends: ['friend1', 'friend2'] },
            ];

            const mockAllFriends = [
                { id: 'friend1', name: 'Alicja' },
                { id: 'friend2', name: 'Bartek' },
                { id: 'friend3', name: 'Celina' },
                { id: 'friend4', name: 'Dawid' },
                { id: 'friend5', name: 'Ewa' }
            ];

            // Assign mock data to global variables for script access
            window.shopping_list_items = mockShoppingListItems;
            window.all_friends = mockAllFriends;
        </script>
        <!-- End Mock Data -->

        <h1 class="text-3xl font-bold text-gray-800 mb-6">Edytuj Listę Zakupów</h1>

        <div class="flex flex-col lg:flex-row gap-8">
            <!-- Left Column (2/3 width on large screens) -->
            <div class="lg:w-2/3">
                <form method="POST" action="/save-shopping-list" class="bg-white p-6 rounded-lg shadow-lg">
                    <h2 class="text-2xl font-semibold text-gray-800 mb-4">Produkty i Kto Za Co Płaci</h2>
                    <p class="text-gray-600 mb-4">Dodaj lub edytuj produkty na liście i przypisz znajomych, którzy mają za nie zapłacić.</p>

                    <div id="products-container" class="mb-6 border border-gray-200 rounded-lg overflow-hidden">
                        <!-- Products will be injected here by JavaScript -->
                    </div>

                    <button type="button" id="add-product" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded-md shadow transition duration-150 ease-in-out">
                        Dodaj Nowy Produkt
                    </button>

                    <!-- The total amount display has been removed as requested -->

                    <div class="mt-8">
                        <button type="submit" class="btn-primary w-full shadow-lg">Zapisz Listę Zakupów</button>
                    </div>
                </form>
            </div>

            <!-- Right Column (1/3 width on large screens) -->
            <div class="lg:w-1/3">
                <div class="bg-white p-6 rounded-lg shadow-lg">
                    <h2 class="text-2xl font-semibold text-gray-800 mb-4">Twoi Znajomi</h2>
                    <p class="text-gray-600 mb-4">Osoby dostępne do przypisania do produktów.</p>
                    <div class="border border-gray-200 rounded-lg overflow-hidden">
                        <table class="table-auto">
                            <thead>
                                <tr>
                                    <th class="px-4 py-2 bg-gray-50">Imię</th>
                                </tr>
                            </thead>
                            <tbody id="friends-list-body">
                                <!-- Friends will be injected here by JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Retrieve data from mock data (or Jinja2 in Flask)
            const shoppingListItems = window.shopping_list_items;
            const allFriends = window.all_friends;

            const productsContainer = document.getElementById('products-container');
            const addProductButton = document.getElementById('add-product');
            // const totalAmountSpan = document.getElementById('total-amount'); // Removed as requested
            const friendsListBody = document.getElementById('friends-list-body');

            let productCounter = 0; // To ensure unique names for new products

            // Function to calculate and display total amount (no longer needed, but keeping for reference if logic was elsewhere)
            function updateTotalAmount() {
                // This function is now empty as the total sum display has been removed.
                // If you had other logic depending on this, it would need to be re-evaluated.
            }

            // Function to create a product item row for the form
            function createProductItem(product = { name: '', assigned_friends: [] }, index) { // 'price' removed from default product
                const div = document.createElement('div');
                div.classList.add('product-item');
                div.setAttribute('data-product-index', index); // Use data attribute for current index

                div.innerHTML = `
                    <input type="text" name="products[${index}][name]" value="${product.name}" placeholder="Nazwa produktu" required
                           class="flex-grow p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" />
                    <!-- Price input removed as requested -->
                    <div class="checkbox-container flex-grow">
                        <!-- Friend checkboxes will go here -->
                    </div>
                    <button type="button" class="remove-product bg-red-500 hover:bg-red-600 text-white text-sm py-1.5 px-3 rounded-md transition duration-150">Usuń</button>
                `;

                const checkboxContainer = div.querySelector('.checkbox-container');
                allFriends.forEach(friend => {
                    const isChecked = product.assigned_friends.includes(friend.id) ? 'checked' : '';
                    checkboxContainer.innerHTML += `
                        <label class="checkbox-label">
                            <input type="checkbox" name="products[${index}][friends][]" value="${friend.id}" ${isChecked}
                                   class="form-checkbox text-blue-600 rounded focus:ring-blue-500" />
                            <span>${friend.name}</span>
                        </label>
                    `;
                });

                // No event listener for price changes as price input is removed
                // div.querySelector('.product-price-input').addEventListener('input', updateTotalAmount);

                return div;
            }

            // Initialize products from shoppingListItems
            if (shoppingListItems.length > 0) {
                shoppingListItems.forEach((product, idx) => {
                    productsContainer.appendChild(createProductItem(product, productCounter++));
                });
            } else {
                // If no products, add one empty product initially
                productsContainer.appendChild(createProductItem({}, productCounter++));
            }
            updateTotalAmount(); // Call once initially, though it does nothing now

            // Add new product button event
            addProductButton.addEventListener('click', function() {
                productsContainer.appendChild(createProductItem({}, productCounter++));
                updateTotalAmount(); // Still called, but no effect on total sum display
            });

            // Handle remove product button click
            productsContainer.addEventListener('click', function(event) {
                if (event.target.classList.contains('remove-product')) {
                    const productItem = event.target.closest('.product-item');
                    if (productItem) {
                        productItem.remove();
                        // Re-index remaining products to maintain array structure for Flask
                        reindexProducts();
                        updateTotalAmount(); // Still called, but no effect on total sum display
                    }
                }
            });

            // Function to re-index products after removal
            function reindexProducts() {
                let currentIdx = 0;
                productsContainer.querySelectorAll('.product-item').forEach(item => {
                    // Update data-product-index attribute
                    item.setAttribute('data-product-index', currentIdx);

                    // Update name attributes for inputs and checkboxes
                    item.querySelectorAll('input[name^="products["]').forEach(input => {
                        const oldName = input.getAttribute('name');
                        // Use regex to replace the index part of the name, e.g., products[0][name] -> products[1][name]
                        input.name = oldName.replace(/products\[\d+\]/, `products[${currentIdx}]`);
                    });

                    currentIdx++;
                });
                productCounter = currentIdx; // Reset productCounter to the new total count
            }

            // Populate friends list
            allFriends.forEach(friend => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td class="px-4 py-2">${friend.name}</td>`;
                friendsListBody.appendChild(tr);
            });
        });
    </script>
</body>
</html>
